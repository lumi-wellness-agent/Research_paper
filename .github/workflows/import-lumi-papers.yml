name: Import LUMI papers (8 required)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-lumi-papers.yml'
      - '.github/scripts/import_lumi_papers.py'
      - 'ReST/*.pdf'
      - 'Mindfulness/*.pdf'
      - 'color/*.pdf'

permissions:
  contents: write

concurrency:
  group: lumi-paper-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF validator
        run: python -m pip install 'pypdf==6.10.0'
      - name: Download and validate all eight papers
        id: download
        continue-on-error: true
        run: python .github/scripts/import_lumi_papers.py
      - name: Commit verified PDFs (including partial progress)
        if: ${{ !cancelled() && steps.download.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          report = Path('paper-import-results.json')
          if report.exists():
              for item in json.loads(report.read_text()):
                  if item['status'] in ('downloaded', 'verified'):
                      subprocess.run(['git', 'add', '--', item['path']], check=True)
          PY
          if ! git diff --cached --quiet; then
            git commit -m "docs: import verified LUMI research PDFs"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Save per-paper import report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lumi-paper-import-results
          path: paper-import-results.json
          if-no-files-found: error
      - name: Require all eight PDFs
        if: ${{ !cancelled() }}
        run: python .github/scripts/import_lumi_papers.py --verify-only
