name: Import open-access LUMI papers

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-lumi-papers.yml'

permissions:
  contents: write

jobs:
  import-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify CC BY papers
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request
          papers = [
            ("color/An Experimental Exploration of the Effects of Exposure to Images of Nature on Rumination.pdf", [
              "https://www.mdpi.com/1660-4601/15/2/300/pdf",
              "https://pmc.ncbi.nlm.nih.gov/articles/PMC5858369/pdf/ijerph-15-00300.pdf"
            ]),
            ("color/Effect of the Art Coloring Online Coloring Game on Subjective Well-Being Increase and Anxiety Reduction During the COVID-19 Pandemic.pdf", [
              "https://games.jmir.org/2022/3/e37026/PDF",
              "https://pmc.ncbi.nlm.nih.gov/articles/PMC9524359/pdf/games_v10i3e37026.pdf"
            ])
          ]
          failures=[]
          for dest, urls in papers:
            target=pathlib.Path(dest)
            if target.exists(): continue
            for url in urls:
              try:
                req=urllib.request.Request(url,headers={"User-Agent":"LUMI-PaperSync/1.0 academic bibliography"})
                with urllib.request.urlopen(req, timeout=25) as response:
                  b=response.read(25000000)
                if not b.startswith(b"%PDF-") or len(b)<10000: raise ValueError("Not valid PDF")
                target.parent.mkdir(parents=True,exist_ok=True)
                target.write_bytes(b)
                print("DOWNLOADED",dest,len(b),url)
                break
              except Exception as e: print("FAILED",dest,url,type(e).__name__,str(e)[:200])
            if not target.exists(): failures.append(dest)
          if failures: print("COULD NOT IMPORT:",failures)
          PY
      - name: Commit newly downloaded papers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add color/*.pdf
          if git diff --cached --quiet; then
            echo "No PDFs were successfully downloaded."
          else
            git commit -m "docs: add two CC BY LUMI research paper PDFs"
            git push
          fi
